[Application Options]

; ------------------------------------------------------------------------------
; Data and configuration
; ------------------------------------------------------------------------------

; The directory this game keeps everything in: its identity, the tables it has
; sat at, the transcripts of hands it has played, and its log. Everything below
; is rooted here unless named separately.
; Default on Linux is ~/.dcrpoker.
; appdata=~/.dcrpoker

; Where the identity and table records live. Defaults to the application data
; directory itself, which is where an existing game already keeps them. Point
; two copies of this program at two directories to run two players on one
; machine.
; datadir=~/.dcrpoker

; ------------------------------------------------------------------------------
; The interface
; ------------------------------------------------------------------------------

; The address this game serves its own interface on. It must be a loopback
; address: the page is guarded by a token minted fresh each run and printed to
; the terminal that started it, which is a session key and not something that
; survives being put on a network.
; listen=127.0.0.1:8790

; ------------------------------------------------------------------------------
; Network
; ------------------------------------------------------------------------------

; The chain to play on. Mainnet unless one of these is set, and setting both is
; refused. A game whose network disagrees with its bridge will not start: the
; two build different scripts, and the difference is paid for in real money.
; testnet=1
; simnet=1

; ------------------------------------------------------------------------------
; Logging
; ------------------------------------------------------------------------------

; Where the rotating log file is written. Defaults to a network-scoped
; directory under the application data directory, e.g. ~/.dcrpoker/logs/mainnet.
; logdir=~/.dcrpoker/logs

; The size at which the log rolls. A rolled file is gzipped and three are kept.
; Takes a number and a unit: K, M or G.
; logsize=10M

; How much to log. Either one level for everything, or a list naming
; subsystems, e.g. info,TABL=debug,BRDG=trace.
;
; Levels:   trace, debug, info, warn, error, critical, off
; Subsystems:
;   POKR  starting up, and the program itself
;   TABL  forming a table: joins, commitments, the draw, seating
;   PLAY  hands and betting
;   COIN  funding, bonds, escrow and payments
;   CHAN  what the chain was seen to hold
;   SETL  settling, paying out, claims and releases
;   DSPT  challenges and complaints
;   BRDG  the connection to the bridge
;   HTTP  the local interface
; debuglevel=info

[bridge]

; ------------------------------------------------------------------------------
; The bridge
; ------------------------------------------------------------------------------

; How to reach a dcrpulse gaming bridge, and the credential to reach it with.
; The bridge is what asks a person before any money moves; this game cannot
; spend on its own.
;
; Leave this section empty and the first run asks for it on the terminal,
; checks it by connecting, and writes it down beside this file. Fill all four
; in and no question is asked, which is what a machine started by a service
; manager needs. Filling in some but not all is refused.
;
; bridge.addr=127.0.0.1:8443
; bridge.clientcert=~/.dcrpoker/client.cert
; bridge.clientkey=~/.dcrpoker/client.key
; bridge.cert=~/.dcrpoker/bridge.cert
